name: CI

on:
  push:
    branches: [V2]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Validate composer.json
        run: composer validate --strict
      - name: PHP lint
        run: find src config routes public -name '*.php' -print0 | xargs -0 -n1 php -l
