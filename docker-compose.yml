# Local/test stack for Nickelpinch: Caddy + php-fpm + MySQL. Modeled on taskshare.
# Usage:
#   cp config/_env.php.template config/_env.php     # DB_SERVER=db, DB_NAME/USER/PASS=nickelpinch
#   docker compose run --rm composer                # one-time: install vendor/
#   docker compose up -d                            # app on http://localhost:8080
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nickelpinch
      MYSQL_USER: nickelpinch
      MYSQL_PASSWORD: nickelpinch
    volumes:
      # Core migrations (001-004: users / login_attempts / settings / reset-expiry) run first,
      # then the app migration (100-) adds Nickelpinch's tables. Not :ro — the app file mounts
      # nested under this dir, which needs a writable parent.
      - ./vendor/timbotron/initium-php-core/migrations:/docker-entrypoint-initdb.d
      - ./db/100-migration-nickelpinch.sql:/docker-entrypoint-initdb.d/100-migration-nickelpinch.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unickelpinch", "-pnickelpinch"]
      interval: 5s
      retries: 12

  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    working_dir: /srv
    volumes:
      - ./:/srv
    command: sh -c "mkdir -p /srv/storage/sessions && chown -R www-data:www-data /srv/storage && exec php-fpm"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/srv
    depends_on:
      - php

  # one-shot: `docker compose run --rm composer` to populate vendor/
  composer:
    image: composer:2
    working_dir: /srv
    volumes:
      - ./:/srv
    command: install --ignore-platform-reqs --no-interaction
    profiles: ["setup"]

  # one-shot, opt-in demo/dev seed — never runs on `up` or fresh-volume init:
  #   docker compose --profile seed run --rm seed
  # Loads db/seed-dev.sql into the running db (demo@nickelpinch.test / demo1234).
  seed:
    image: mysql:8
    volumes:
      - ./db/seed-dev.sql:/seed-dev.sql:ro
    command: sh -c "mysql -h db -unickelpinch -pnickelpinch nickelpinch < /seed-dev.sql"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["seed"]

volumes:
  dbdata:
